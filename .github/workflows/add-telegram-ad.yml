name: Add Telegram Promo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix promo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''
<style id="telegramPromoStyle">#telegramPromo{max-width:1180px;margin:0 auto 28px;padding:0 20px}#telegramPromo .tgLink{display:block;text-decoration:none;color:inherit}#telegramPromo .tgCard{position:relative;overflow:hidden;border:1px solid #6e4cff;border-radius:22px;padding:28px 26px;background:linear-gradient(135deg,#15102b,#0d1724 55%,#111022);box-shadow:0 18px 55px #0008;text-align:center;cursor:pointer;transition:.2s}#telegramPromo .tgCard:hover{transform:translateY(-3px);border-color:#8b7bff}#telegramPromo .tgGlow{position:absolute;width:180px;height:180px;border-radius:50%;background:#7c4dff33;filter:blur(35px);right:-45px;top:-65px}#telegramPromo h2{position:relative;margin:0 0 10px;font-size:clamp(24px,4vw,38px);color:#fff}#telegramPromo p{position:relative;color:#b9bfd0;margin:0 auto;max-width:720px;line-height:1.8}@media(max-width:520px){#telegramPromo{padding:0 12px}#telegramPromo .tgCard{padding:24px 16px}}
</style>'''
          html='''
<section id="telegramPromo" aria-label="BB Chat">
  <a class="tgLink" href="https://t.me/BB_chat666" target="_blank" rel="noopener noreferrer">
    <div class="tgCard">
      <div class="tgGlow"></div>
      <h2>🌍🔥 BB Chat</h2>
      <p>💬 یک دورهمی دوستانه برای چت و آشنایی با آدم‌های مختلف از سراسر دنیا!</p>
    </div>
  </a>
</section>
'''

          # Remove any previous Telegram promo and its old styling.
          s=re.sub(r'<style id="telegramPromoStyle">.*?</style>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<section id="telegramPromo".*?</section>\s*', '', s, count=1, flags=re.S)

          marker='<main class="wrap">'
          if marker in s:
              s=s.replace(marker, css+html+marker, 1)
          else:
              s=s.replace('</body>', css+html+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Fix BB Chat promo display" && git push)
