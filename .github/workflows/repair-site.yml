name: Repair FPS ARENA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[site-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair site core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Make the chatbot open/close work even if another optional script fails.
          s=s.replace('<button id="aiChatBtn" aria-label="دستیار هوشمند">🤖</button>', '<button id="aiChatBtn" type="button" aria-label="دستیار هوشمند" onclick="var c=document.getElementById(\'aiChat\');if(c){c.style.display=\'flex\';var i=document.getElementById(\'aiInput\');if(i)i.focus();}">🤖</button>')
          s=s.replace('<button id="aiClose" class="aiClose">×</button>', '<button id="aiClose" type="button" class="aiClose" onclick="var c=document.getElementById(\'aiChat\');if(c)c.style.display=\'none\';">×</button>')

          # Ensure chatbot is visually above the page and usable on mobile.
          if '#aiChatBtn{position:fixed' in s and 'pointer-events:auto' not in s:
              s=s.replace('#aiChatBtn{position:fixed', '#aiChatBtn{pointer-events:auto;position:fixed', 1)

          # Fix Persian whitespace normalization in the chatbot regex.
          s=s.replace("replace(/\\\\s+/g,' ')", "replace(/\\s+/g,' ')")

          # Keep the game count dynamic.
          s=s.replace('<b id="count">100</b> بازی','<b id="count">0</b> بازی')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'doctype':s.lower().startswith('<!doctype html>'),
            'body':'<body' in s and '</body>' in s,
            'script':'<script' in s and '</script>' in s,
            'chat_button':'id="aiChatBtn"' in s and 'onclick=' in s,
            'chat_panel':'id="aiChat"' in s,
            'fps_function':bool(re.search(r'function fps\(d,g,r,q\)',s)),
            'render_function':'function render()' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          print('Validation passed:', checks)
          PY

      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix chatbot open button [site-repair]"
          git push