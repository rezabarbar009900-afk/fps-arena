name: Repair FPS ARENA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[site-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original site data and layout
        run: |
          cp "FPS_ARENA_Games_FPS_Improved (4).html" index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px;margin-top:20px}', '.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px;margin-top:55px}')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate restored site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('doctype',s.lower().startswith('<!doctype html>')),
            ('body','<body' in s and '</body>' in s),
            ('game search','id="search"' in s),
            ('phone search','id="deviceSearch"' in s),
            ('phone catalog','const phoneCatalog=[]' in s),
            ('10000 configs','phoneCatalog.length<10000' in s),
            ('games array','const games=[' in s),
            ('100 games label','id="count">100</b> بازی' in s),
            ('games spacing','margin-top:55px' in s),
          ]
          bad=[k for k,v in checks if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          m=re.search(r'const games=\[(.*?)\];',s,re.S)
          if not m: raise SystemExit('Games array missing')
          game_count=len(re.findall(r"\['",m.group(1)))
          if game_count != 100: raise SystemExit(f'Expected 100 games, found {game_count}')
          print('FPS ARENA restored: 100 games + 10,000 phone/config entries')
          PY

      - name: Commit restored site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore original games and phone catalog [site-repair]"
          git push
