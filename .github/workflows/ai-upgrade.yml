name: Fix FPS ARENA chatbot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair chatbot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="fpsArenaAiV3"' not in s:
              block=r'''<style id="fpsArenaAiV3">#aiChatBtn{position:fixed;right:22px;bottom:22px;z-index:99999;width:58px;height:58px;border:0;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#25d9e8);color:#fff;font-size:25px;box-shadow:0 10px 35px #0008}#aiChat{display:none;position:fixed;right:22px;bottom:92px;z-index:99998;width:min(390px,calc(100vw - 28px));height:520px;background:#0d1019;border:1px solid #343a50;border-radius:20px;box-shadow:0 25px 80px #000b;overflow:hidden;flex-direction:column;direction:rtl}#aiHead{padding:14px 16px;background:#111522;border-bottom:1px solid #292f42;display:flex;align-items:center;justify-content:space-between;font-weight:800}#aiClose{border:0;background:transparent;color:#aaa;font-size:24px;cursor:pointer}#aiMsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.aiMsg{max-width:88%;padding:10px 12px;border-radius:13px;white-space:pre-wrap;line-height:1.6;font-size:14px}.aiUser{align-self:flex-start;background:#28446b}.aiBot{align-self:flex-end;background:#171d2c}#aiForm{display:flex;gap:8px;padding:11px;border-top:1px solid #292f42;background:#0a0d14}#aiInput{flex:1;min-width:0;padding:11px;border-radius:11px;border:1px solid #30374b;background:#111521;color:#fff;outline:none;direction:rtl}#aiSend{border:0;border-radius:11px;padding:0 15px;background:#6658ff;color:#fff;font-weight:800;cursor:pointer}</style><div id="fpsArenaAiV3"><button id="aiChatBtn" type="button">🤖</button><div id="aiChat"><div id="aiHead"><span>🤖 دستیار FPS ARENA</span><button id="aiClose" type="button">×</button></div><div id="aiMsgs"></div><form id="aiForm"><input id="aiInput" autocomplete="off" placeholder="مثلاً POCO C65 فری فایر چند FPS؟"><button id="aiSend" type="submit">ارسال</button></form></div></div><script>(function(){const $=id=>document.getElementById(id),b=$('aiChatBtn'),c=$('aiChat'),x=$('aiClose'),m=$('aiMsgs'),f=$('aiForm'),i=$('aiInput');if(!b||!c||!x||!m||!f||!i)return;const norm=v=>String(v||'').toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').replace(/\s+/g,' ').trim(),games=window.__fpsArenaGames||[],phones=window.__fpsArenaPhones||[];const aliases={'فری فایر':'Free Fire','freefire':'Free Fire','ff':'Free Fire','کالاف':'Call of Duty: Mobile','کال اف دیوتی':'Call of Duty: Mobile','cod':'Call of Duty: Mobile','پابجی':'PUBG Mobile','pubg':'PUBG Mobile','ماینکرفت':'Minecraft','minecraft':'Minecraft','گنشین':'Genshin Impact','براول':'Brawl Stars','ای فوتبال':'eFootball','efootball':'eFootball','فورتنایت':'Fortnite','فورت نایت':'Fortnite','رابلوکس':'Roblox','روبلاکس':'Roblox'};const add=(t,u)=>{const d=document.createElement('div');d.className='aiMsg '+(u?'aiUser':'aiBot');d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight};const open=()=>{c.style.display='flex';i.focus()},shut=()=>c.style.display='none';b.onclick=()=>c.style.display==='flex'?shut():open();x.onclick=shut;const game=q=>{const n=norm(q);for(const k in aliases)if(n.includes(k))return aliases[k];return games.find(g=>n.includes(norm(g[0])))?.[0]||null};const phone=q=>{const n=norm(q);return phones.find(p=>n.includes(norm(p.name)))||null};const reply=q=>{const n=norm(q),p=phone(q),g=game(q);if(/^(سلام|درود|hello|hi|hey)\b/.test(n))return'سلام 😎 من دستیار FPS ARENA هستم. اسم گوشی و بازی را بگو.';if(/کمک|help/.test(n))return'می‌توانم FPS، مشخصات گوشی، RAM، کیفیت و مقایسه گوشی‌ها را بررسی کنم.';if(/مقایسه|بهتره|فرق|vs|در برابر/.test(n)){const h=phones.filter(x=>n.includes(norm(x.name)));if(h.length<2)return'نام هر دو گوشی را بنویس؛ مثلاً «POCO C65 با Redmi 13C مقایسه کن».';return'📱 '+h[0].name+' — '+h[0].chip+'\n📱 '+h[1].name+' — '+h[1].chip+'\n\n⚡ مقایسه بر اساس چیپست ثبت‌شده در دیتابیس سایت انجام شد.'}if(/رم|ram/.test(n)){const r=n.match(/(?:ram|رم)\s*(4|6|8|12|16)/);if(r&&$('ram')){$('ram').value=r[1];if(typeof render==='function')render()}return'💾 RAM فعلی سایت: '+($('ram')?.value||8)+'GB.'}if(/کیفیت|گرافیک|quality|low|medium|high|ultra/.test(n)){const qv=/ultra|خیلی بالا/.test(n)?'ultra':/high|بالا/.test(n)?'high':/low|پایین/.test(n)?'low':'medium';if($('quality')){$('quality').value=qv;if(typeof render==='function')render()}return'🎮 کیفیت روی '+qv.toUpperCase()+' تنظیم شد.'}if(/fps|فریم|چند فریم/.test(n)){if(!p||!g)return'برای FPS، اسم گوشی و بازی را با هم بفرست؛ مثلاً «POCO C65 فری فایر چند FPS؟»';if($('deviceSearch')){$('deviceSearch').value=p.name;if(typeof selectDeviceBySearch==='function')selectDeviceBySearch()}if($('search')){$('search').value=g;if(typeof render==='function')render()}setTimeout(()=>{},0);const card=[...document.querySelectorAll('.game')].find(z=>norm(z.querySelector('h3')?.textContent)===norm(g));return'📱 '+p.name+'\n🎮 '+g+'\n⚡ FPS تخمینی سایت: '+(card?.querySelector('.fps')?.textContent||'نامشخص')}if(p)return'📱 '+p.name+' پیدا شد. اسم بازی را بفرست.';if(g)return'🎮 '+g+' پیدا شد. اسم گوشی را هم بفرست.';return'متوجه نشدم 😊 اسم گوشی یا بازی را بنویس.'};add('سلام! 🤖 آماده‌ام. مثلاً «POCO C65 فری فایر چند FPS؟»',false);f.addEventListener('submit',e=>{e.preventDefault();const q=i.value.trim();if(!q)return;add(q,true);i.value='';setTimeout(()=>{try{add(reply(q),false)}catch(err){console.error(err);add('خطای موقت رخ داد؛ دوباره امتحان کن.',false)}},100)});})();</script>'''
              s=s.replace('</body>',block+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['const games=[','const phoneSeeds=[','const phoneCatalog=[]','id="fpsArenaAiV3"','id="aiChatBtn"','id="aiChat"','id="aiForm"']:
            assert x in s, x
          print('CHATBOT OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Repair chatbot and site bugs' && git push)
