name: Fix FPS ARENA chatbot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable chatbot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="fpsArenaSmartBot"' not in s:
            block=r'''<style id="fpsArenaSmartBotStyle">#fpsArenaSmartBtn{position:fixed;right:22px;bottom:22px;z-index:999999;width:62px;height:62px;border:0;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#25d9e8);color:#fff;font-size:27px;box-shadow:0 12px 40px #0009}#fpsArenaSmartChat{display:none;position:fixed;right:22px;bottom:96px;z-index:999998;width:min(410px,calc(100vw - 24px));height:min(600px,calc(100vh - 120px));background:#0d1019;border:1px solid #343a50;border-radius:20px;box-shadow:0 25px 90px #000c;overflow:hidden;flex-direction:column;direction:rtl}#fpsArenaSmartHead{padding:14px 16px;background:#111522;border-bottom:1px solid #292f42;display:flex;align-items:center;justify-content:space-between;font-weight:900}#fpsArenaSmartClose{border:0;background:transparent;color:#aaa;font-size:25px;cursor:pointer}#fpsArenaSmartMsgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.fpsSmartMsg{max-width:90%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.65;font-size:14px}.fpsSmartUser{align-self:flex-start;background:#28446b}.fpsSmartBot{align-self:flex-end;background:#171d2c}#fpsArenaSmartForm{display:flex;gap:8px;padding:11px;border-top:1px solid #292f42;background:#0a0d14}#fpsArenaSmartInput{flex:1;min-width:0;padding:11px;border-radius:11px;border:1px solid #30374b;background:#111521;color:#fff;outline:none;direction:rtl}#fpsArenaSmartSend{border:0;border-radius:11px;padding:0 15px;background:#6658ff;color:#fff;font-weight:900;cursor:pointer}@media(max-width:520px){#fpsArenaSmartBtn{right:14px;bottom:14px}#fpsArenaSmartChat{right:12px;bottom:88px;width:calc(100vw - 24px);height:min(570px,calc(100vh - 105px))}}</style><div id="fpsArenaSmartBot"><button id="fpsArenaSmartBtn" type="button">🤖</button><div id="fpsArenaSmartChat"><div id="fpsArenaSmartHead"><span>🤖 دستیار هوشمند FPS ARENA</span><button id="fpsArenaSmartClose" type="button">×</button></div><div id="fpsArenaSmartMsgs"></div><form id="fpsArenaSmartForm"><input id="fpsArenaSmartInput" autocomplete="off" placeholder="مثلاً: POCO C65 فری فایر چند FPS؟"><button id="fpsArenaSmartSend" type="submit">ارسال</button></form></div></div><script>(()=>{const B=id=>document.getElementById(id),btn=B('fpsArenaSmartBtn'),chat=B('fpsArenaSmartChat'),cls=B('fpsArenaSmartClose'),msgs=B('fpsArenaSmartMsgs'),form=B('fpsArenaSmartForm'),inp=B('fpsArenaSmartInput');if(!btn||!chat||!cls||!msgs||!form||!inp)return;const N=x=>String(x??'').toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').replace(/[؟?!،]/g,' ').replace(/\s+/g,' ').trim(),gamesA=()=>typeof games!=='undefined'?games:[],phonesA=()=>typeof phoneCatalog!=='undefined'?phoneCatalog:[],add=(t,u)=>{const d=document.createElement('div');d.className='fpsSmartMsg '+(u?'fpsSmartUser':'fpsSmartBot');d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight},open=()=>{chat.style.display='flex';inp.focus()},shut=()=>chat.style.display='none';btn.onclick=()=>chat.style.display==='flex'?shut():open();cls.onclick=shut;const aliases={'فری فایر':'Free Fire','free fire':'Free Fire','freefire':'Free Fire','ff':'Free Fire','کالاف':'Call of Duty: Mobile','کال اف':'Call of Duty: Mobile','کال اف دیوتی':'Call of Duty: Mobile','cod':'Call of Duty: Mobile','پابجی':'PUBG Mobile','pubg':'PUBG Mobile','ماینکرفت':'Minecraft','minecraft':'Minecraft','گنشین':'Genshin Impact','براول':'Brawl Stars','فورتنایت':'Fortnite','فورت نایت':'Fortnite','رابلوکس':'Roblox','ای فوتبال':'eFootball','efootball':'eFootball','وارزون':'Call of Duty: Warzone Mobile','بلاد استرایک':'Blood Strike','دلتا فورس':'Delta Force Mobile'},findGame=q=>{const n=N(q);for(const k in aliases)if(n.includes(k))return aliases[k];return gamesA().find(g=>n.includes(N(g[0])))?.[0]||null},findPhones=q=>{const n=N(q),o=[];for(const p of phonesA())if(n.includes(N(p.name))&&!o.some(x=>x.name===p.name))o.push(p);return o},setPhone=p=>{const e=B('deviceSearch');if(e&&p){e.value=p.name+' — '+p.variant+' — '+p.chip.toUpperCase();if(typeof selectDeviceBySearch==='function')selectDeviceBySearch()}},setGame=g=>{const e=B('search');if(e&&g){e.value=g;if(typeof render==='function')render()}},card=g=>[...document.querySelectorAll('.game')].find(e=>N(e.querySelector('h3')?.textContent)===N(g)),answer=q=>{const n=N(q),ps=findPhones(q),p=ps[0],g=findGame(q);if(/^(سلام|درود|hello|hi|hey)\b/.test(n))return'سلام 😎 من دستیار FPS ARENA هستم.\nگوشی و بازی را بگو تا FPS را حساب کنم.';if(/کمک|help|چی میتونی|چه کار/.test(n))return'می‌توانم FPS تخمینی، چیپست، RAM، کیفیت و مقایسه گوشی‌ها را بررسی کنم.';if(/مقایسه|بهتره|کدوم بهتر|فرق|vs|در برابر/.test(n)){if(ps.length<2)return'نام هر دو گوشی را بنویس؛ مثلاً «POCO C65 با Redmi 13C مقایسه کن».';const a=ps[0],b=ps[1],pa=Number(power[a.chip]??1.5),pb=Number(power[b.chip]??1.5),w=pa===pb?'تقریباً برابر':pa>pb?a.name:b.name;return'📱 '+a.name+' — '+a.chip.toUpperCase()+'\n📱 '+b.name+' — '+b.chip.toUpperCase()+'\n\n🏆 نتیجه بر اساس چیپست: '+w+'\n⚠️ نتیجه تخمینی است.'}if(/چیپست|پردازنده|cpu|soc/.test(n))return p?'📱 '+p.name+'\n🧠 چیپست: '+p.chip.toUpperCase()+'\n💾 '+p.variant:'اسم گوشی را هم بنویس؛ مثلاً «چیپست POCO C65 چیه؟»';if(/رم|ram/.test(n)){const m=n.match(/(?:ram|رم)\s*(4|6|8|12|16)/);if(m&&B('ram')){B('ram').value=m[1];if(typeof render==='function')render();return'💾 RAM روی '+m[1]+'GB تنظیم شد.'}return'💾 RAM فعلی: '+(B('ram')?.value||'8')+'GB.'}if(/کیفیت|گرافیک|quality|low|medium|high|ultra|پایین|متوسط|بالا/.test(n)){const qv=/ultra|خیلی بالا/.test(n)?'ultra':/high|بالا/.test(n)?'high':/low|پایین/.test(n)?'low':'medium';if(B('quality')){B('quality').value=qv;if(typeof render==='function')render()}return'🎮 کیفیت روی '+qv.toUpperCase()+' تنظیم شد.'}if(/fps|فریم|چند فریم/.test(n)){if(!p&&!g)return'برای FPS، اسم گوشی و بازی را با هم بفرست؛ مثلاً «POCO C65 فری فایر چند FPS؟»';if(!p)return'🎮 '+g+' پیدا شد؛ اسم گوشی را هم بفرست.';if(!g)return'📱 '+p.name+' پیدا شد؛ اسم بازی را هم بفرست.';setPhone(p);setGame(g);const c=card(g);return'📱 '+p.name+'\n🎮 '+g+'\n⚡ '+(c?.querySelector('.fps')?.textContent||'FPS نامشخص')+'\n\nعدد تخمینی است و دما، نسخه بازی و تنظیمات اثر دارند.'}if(p&&g){setPhone(p);setGame(g);const c=card(g);return'📱 '+p.name+'\n🎮 '+g+'\n⚡ '+(c?.querySelector('.fps')?.textContent||'FPS نامشخص')}if(p)return'📱 '+p.name+' پیدا شد.\nاسم بازی را هم بگو.';if(g)return'🎮 '+g+' پیدا شد.\nاسم گوشی را هم بگو.';return'متوجه نشدم 😅 مثال: «POCO C65 فری فایر چند FPS؟»'};add('سلام! 🤖\nمن آماده‌ام؛ گوشی و بازی را بنویس.');form.addEventListener('submit',e=>{e.preventDefault();const q=inp.value.trim();if(!q)return;add(q,true);inp.value='';setTimeout(()=>{try{add(answer(q))}catch(err){console.error(err);add('خطای موقت رخ داد؛ دوباره بفرست.')}},100)});})();</script>'''
            s=s.replace('</body>',block+'</body>')
          s=s.replace('.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px;', '.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px;margin-top:55px;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['const games=[','const phoneSeeds=[','const phoneCatalog=[]','while(phoneCatalog.length<10000)','id="fpsArenaSmartBot"','id="fpsArenaSmartForm"']:
            assert x in s, x
          assert s.count('id="fpsArenaSmartBot"') == 1
          print('SMART CHATBOT OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Install smart FPS ARENA chatbot' && git push)
